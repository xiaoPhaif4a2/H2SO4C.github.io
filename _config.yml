# Core Hexo configuration
# Theme-specific settings belong in _config.butterfly.yml.

# Site identity
title: H2SO4-blog
description: ''
keywords:
author: H2SO4C
language: zh-CN
timezone: Asia/Shanghai

# Public URL and routes
url: https://h2so4-blog.vercel.app
permalink: :year/:month/:day/:title/
pretty_urls:
  trailing_index: true
  trailing_html: true

# Source and generated output
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories

# Authoring
new_post_name: :title.md
default_layout: post
render_drafts: false
post_asset_folder: false
future: true

# Links and syntax highlighting
external_link:
  enable: true
  field: site
  exclude: ''
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Indexes and metadata
index_generator:
  path: ''
  per_page: 10
  order_by: -date
default_category: uncategorized
meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime
per_page: 10
pagination_dir: page

# Theme and generators
theme: butterfly
search:
  path: search.xml
  field: post
  content: true
